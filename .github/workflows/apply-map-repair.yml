name: Apply verified map family beta repair
on:
  push:
    branches: [agent/mobile-companion]
    paths: ['.github/workflows/apply-map-repair.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'joeythepilot/Dad-Radar' && github.ref == 'refs/heads/agent/mobile-companion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-source guarded edits
        run: |
          mkdir -p /tmp/map-repair-proof
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd().resolve()
          edits = []
          for i in range(1, 5):
              edits.extend(json.loads(Path(f'scripts/.map-repair-{i}.json').read_text())['edits'])
          seen = set()
          pending = []
          for edit in edits:
              path = (root / edit['path']).resolve()
              assert path.is_relative_to(root) and edit['path'] not in seen, 'Unsafe or duplicate edit path'
              seen.add(edit['path'])
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == edit['before'], 'Source changed: ' + edit['path']
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(edit['hunks']):
                  assert 0 <= start <= end <= len(lines), 'Invalid edit range'
                  lines[start:end] = replacement.splitlines(keepends=True)
              result = ''.join(lines).encode('utf-8')
              digest = hashlib.sha256(result).hexdigest()
              assert digest == edit['after'], 'Payload mismatch: ' + edit['path'] + ' got ' + digest
              pending.append((path, result))
          for path, result in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
              print('Verified:', path.relative_to(root))
          Path('/tmp/map-repair-proof/verified-files.json').write_text(json.dumps(sorted(seen), indent=2))
          PY
          git diff --check
      - run: npm ci
      - name: Full regression suite and both browser builds
        run: npm test 2>&1 | tee /tmp/map-repair-proof/tests.log
      - name: Browser verification setup
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Responsive geometry and transport frame verification
        run: python scripts/map-hardware-browser-test.py --output /tmp/map-repair-proof/browser 2>&1 | tee /tmp/map-repair-proof/browser.log
      - name: Save tested application code to beta branch
        run: |
          git diff --check
          cp .github/workflows/map-hardware-check.yml /tmp/map-repair-proof/map-hardware-check.yml
          git restore .github/workflows/map-hardware-check.yml
          git rm scripts/.map-repair-1.json scripts/.map-repair-2.json scripts/.map-repair-3.json scripts/.map-repair-4.json
          git add App UI Mobile scripts server index.html .gitignore Docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair map transport handoff, bezel mounts and family layouts'
          git push origin HEAD:refs/heads/agent/mobile-companion
          git rev-parse HEAD > /tmp/map-repair-proof/commit.txt
          cp App/dad-radar-browser.js App/map-roll-browser.js /tmp/map-repair-proof/
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applied-map-repair-${{ github.run_id }}
          path: /tmp/map-repair-proof/
          retention-days: 7
