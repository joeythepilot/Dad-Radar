name: Map hardware family-beta checks
on:
  push:
    branches: [agent/mobile-companion]
    paths:
      - '.github/workflows/map-hardware-check.yml'
      - 'App/map-roll*'
      - 'UI/map-roll-transition.css'
      - 'UI/sequence-history.css'
      - 'scripts/map-hardware*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Save exact reviewed source for local visual verification
        if: always()
        run: |
          mkdir -p /tmp/dad-radar-map-check
          git archive --format=tar.gz HEAD > /tmp/dad-radar-map-check/source.tar.gz
          git rev-parse HEAD > /tmp/dad-radar-map-check/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-hardware-review-${{ github.sha }}
          path: /tmp/dad-radar-map-check/
          retention-days: 3
