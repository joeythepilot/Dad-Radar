name: Map hardware beta verification
on:
  push:
    branches: [agent/mobile-companion, agent/map-roll-verification]
    paths: ['App/**', 'UI/**', 'Mobile/**', 'assets/hardware/**', 'assets/ticker/**', 'assets/split-flap/**', 'scripts/**', 'index.html', 'package*.json', '.github/workflows/map-hardware-beta.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-hardware-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve exact source for local rendering
        run: |
          mkdir -p /tmp/dad-radar-beta-source
          git archive --format=tar.gz -o /tmp/dad-radar-beta-source/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/dad-radar-beta-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: beta-source-${{ github.sha }}
          path: /tmp/dad-radar-beta-source/
          retention-days: 3
          compression-level: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Complete application regression suite
        shell: bash
        run: |
          mkdir -p artifacts/map-regression
          npm test 2>&1 | tee artifacts/map-regression/tests.log
      - name: Record source checkpoint
        if: always()
        run: |
          mkdir -p artifacts/map-regression
          git rev-parse HEAD > artifacts/map-regression/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-regression-${{ github.sha }}
          path: artifacts/map-regression/
          retention-days: 7
  browser:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:browser
      - name: Browser geometry, transport, ticker, and split-flap regression on macOS
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install chromium webkit
          mkdir -p artifacts/map-hardware
          node scripts/map-hardware-headed-test.js 2>&1 | tee artifacts/map-hardware/browser.log
          node scripts/weekly-ticker-headed-test.js 2>&1 | tee -a artifacts/map-hardware/browser.log
          node scripts/split-flap-headed-test.js 2>&1 | tee -a artifacts/map-hardware/browser.log
      - name: Keep exact-SHA verification evidence
        if: always()
        run: |
          mkdir -p artifacts/map-hardware
          git rev-parse HEAD > artifacts/map-hardware/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-hardware-beta-${{ github.sha }}
          path: artifacts/map-hardware/
          retention-days: 7
