name: DadRadar verification
on:
  push:
    branches: [agent/mobile-companion, 'verify/release/**']
  workflow_dispatch:
    inputs:
      mode:
        description: Scoped release since verified deployment, or explicit full audit
        type: choice
        options: [scoped, full]
        default: scoped
      baseline:
        description: Verified running SHA; blank uses recorded baseline
        type: string
        required: false
      preserve_source:
        description: Also archive the complete source for local rendering
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dad-radar-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regression: ${{ steps.select.outputs.regression }}
      full: ${{ steps.select.outputs.full }}
      base: ${{ steps.select.outputs.base }}
      has_browser: ${{ steps.select.outputs.has_browser }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: select
        name: Select coverage conservatively
        env:
          DADRADAR_TEST_MODE: ${{ startsWith(github.ref, 'refs/heads/verify/release/') && 'full' || inputs.mode || 'scoped' }}
          DADRADAR_DIFF_BASE: ${{ inputs.baseline }}
          DADRADAR_PLAN_PATH: coverage-plan.json
        run: node scripts/browser-test-plan.js
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-plan-${{ github.sha }}-${{ github.run_id }}
          path: coverage-plan.json
          retention-days: 7
  regression:
    needs: plan
    if: needs.plan.outputs.regression == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Complete deterministic regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/map-regression
          npm test 2>&1 | tee artifacts/map-regression/tests.log
      - name: Record source checkpoint
        if: always()
        run: |
          mkdir -p artifacts/map-regression
          git rev-parse HEAD > artifacts/map-regression/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-regression-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/map-regression/
          retention-days: 7
  browser:
    needs: plan
    if: needs.plan.outputs.has_browser == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: browser (${{ matrix.engine }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the selected browser
        env:
          DADRADAR_ENGINE: ${{ matrix.engine }}
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install "$DADRADAR_ENGINE"
      - name: Run the selected component and engine
        shell: bash
        env:
          DADRADAR_SUITE: ${{ matrix.suites }}
          DADRADAR_ENGINE: ${{ matrix.engine }}
        run: |
          set -o pipefail
          mkdir -p artifacts/browser
          npm run test:browser -- --suite "$DADRADAR_SUITE" --engine "$DADRADAR_ENGINE" 2>&1 | tee artifacts/browser/browser.log
      - name: Record source checkpoint
        if: always()
        run: |
          mkdir -p artifacts/browser
          git rev-parse HEAD > artifacts/browser/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.engine }}-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/browser/
          retention-days: 7
  release-gate:
    needs: [plan, regression, browser]
    if: always()
    name: release-gate (${{ needs.plan.outputs.full == 'true' && 'full' || format('base {0}', needs.plan.outputs.base) }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require selected exact-SHA release checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SOURCE_SHA: ${{ github.sha }}
          NEED_REGRESSION: ${{ needs.plan.outputs.regression }}
          NEED_BROWSER: ${{ needs.plan.outputs.has_browser }}
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          node - <<'NODE'
          const {assertReleaseResults}=require('./scripts/browser-test-plan');
          assertReleaseResults({regression:process.env.NEED_REGRESSION==='true',matrix:process.env.NEED_BROWSER==='true'?[{}]:[]},
            {plan:process.env.PLAN_RESULT,regression:process.env.REGRESSION_RESULT,browser:process.env.BROWSER_RESULT});
          NODE
          echo "Selected release checks passed for $SOURCE_SHA; baseline $BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
  source-archive:
    if: github.event_name == 'workflow_dispatch' && inputs.preserve_source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive source only when explicitly requested
        run: |
          mkdir -p artifacts/source
          git archive --format=tar.gz -o artifacts/source/source.tar.gz HEAD
          git rev-parse HEAD > artifacts/source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: beta-source-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/source/
          retention-days: 3
          compression-level: 0
