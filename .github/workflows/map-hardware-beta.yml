name: Map hardware beta verification
on:
  push:
    branches: [agent/mobile-companion, agent/map-roll-verification]
    paths: ['App/**', 'UI/**', 'Mobile/**', 'scripts/**', 'index.html', 'package*.json', '.github/workflows/map-hardware-beta.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-hardware-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Browser geometry and transport regression
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium webkit
          mkdir -p artifacts/map-hardware
          xvfb-run --auto-servernum node scripts/map-hardware-headed-test.js 2>&1 | tee artifacts/map-hardware/browser.log
      - name: Keep exact-SHA verification evidence
        if: always()
        run: |
          mkdir -p artifacts/map-hardware
          git rev-parse HEAD > artifacts/map-hardware/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-hardware-beta-${{ github.sha }}
          path: artifacts/map-hardware/
          retention-days: 7
