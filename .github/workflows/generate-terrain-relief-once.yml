name: Generate high-resolution terrain relief once

on:
  push:
    branches: [agent/mobile-companion]
    paths:
      - ".github/workflows/generate-terrain-relief-once.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-companion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build DadRadar regional relief from Natural Earth
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None

          source = Path("/tmp/GRAY_HR_SR.tif")
          url = "https://raw.githubusercontent.com/nvkelso/natural-earth-raster/master/10m_rasters/GRAY_HR_SR/GRAY_HR_SR.tif"
          urlretrieve(url, source)

          west, east, south, north = -135.0, -55.0, 5.0, 62.0
          with Image.open(source) as image:
              width, height = image.size
              left = round((west + 180.0) / 360.0 * width)
              right = round((east + 180.0) / 360.0 * width)
              top = round((90.0 - north) / 180.0 * height)
              bottom = round((90.0 - south) / 180.0 * height)
              relief = image.crop((left, top, right, bottom)).convert("L")
              out = Path("assets/maps/north-america-caribbean-relief-hires.jpg")
              relief.save(out, "JPEG", quality=92, optimize=True, progressive=True)
              print(f"source={width}x{height} crop={relief.width}x{relief.height} output={out}")
          PY
      - name: Commit generated terrain asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maps/north-america-caribbean-relief-hires.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add high-resolution regional terrain relief"
          git push origin HEAD:agent/mobile-companion
