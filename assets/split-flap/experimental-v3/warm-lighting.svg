<svg xmlns="http://www.w3.org/2000/svg" width="826" height="1514" viewBox="0 0 826 1514">
<!-- Rectangular recessed incandescent lamp at the inner upper lip.
     Only illumination pixels; native blank/off opacity controls this entire layer. -->
<defs>
 <linearGradient id="filament" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#ffe5ba" stop-opacity=".55"/>
  <stop offset=".35" stop-color="#fff0ce" stop-opacity=".98"/>
  <stop offset=".7" stop-color="#ffd58b" stop-opacity=".9"/>
  <stop offset="1" stop-color="#d88930" stop-opacity=".1"/>
 </linearGradient>
 <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#ffd28b" stop-opacity=".55"/>
  <stop offset=".17" stop-color="#ffc36f" stop-opacity=".27"/>
  <stop offset=".48" stop-color="#edac55" stop-opacity=".09"/>
  <stop offset="1" stop-color="#edac55" stop-opacity="0"/>
 </linearGradient>
 <radialGradient id="pool" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(413 188) scale(276 268)">
  <stop stop-color="#ffd99a" stop-opacity=".72"/>
  <stop offset=".32" stop-color="#ffc16c" stop-opacity=".38"/>
  <stop offset=".68" stop-color="#e5a04a" stop-opacity=".12"/>
  <stop offset="1" stop-color="#e5a04a" stop-opacity="0"/>
 </radialGradient>
 <filter id="lamp-soft" x="-25%" y="-150%" width="150%" height="400%"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="spill-soft" x="-25%" y="-20%" width="150%" height="140%"><feGaussianBlur stdDeviation="24"/></filter>
 <clipPath id="inside"><rect x="122" y="98" width="584" height="640" rx="20"/></clipPath>
</defs>
<g clip-path="url(#inside)">
 <path d="M248 141H578L682 659H144Z" fill="url(#spill)" filter="url(#spill-soft)"/>
 <rect width="826" height="1514" fill="url(#pool)"/>
 <rect x="244" y="130" width="338" height="28" rx="5" fill="#ffd18b" opacity=".65" filter="url(#lamp-soft)"/>
 <rect x="252" y="130" width="322" height="17" rx="3" fill="url(#filament)"/>
</g>
</svg>
