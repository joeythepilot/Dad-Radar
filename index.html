<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dad Radar</title>

  <link rel="stylesheet" href="UI/styles.css">
</head>

<body>
  <section class="startup-screen" id="startup-screen">
    <p class="unit-label">FLIGHT OPERATIONS UNIT NO. 001</p>

    <h1>DAD RADAR</h1>

    <p class="status-message">
      INITIALIZING FLIGHT SYSTEMS...
    </p>
  </section>

  <main class="dashboard" id="dashboard" hidden>
    <header class="top-bar">
      <div>
        <p class="small-label">DAD RADAR</p>
        <h2>FLIGHT OPERATIONS</h2>
      </div>

      <div class="current-status">
        <p class="small-label">CURRENT STATUS</p>
        <p class="status-value">HOME</p>
      </div>
    </header>

    <section class="flight-board">
      <span>NO ACTIVE FLIGHT</span>
    </section>

    <section class="display-grid">
      <article class="panel map-panel">
        <p class="panel-label">MOVING MAP</p>
        <div class="placeholder">MAP DISPLAY</div>
      </article>

      <article class="panel instrument-panel">
        <p class="panel-label">FLIGHT DATA</p>

        <div class="instrument-row">
          <div class="instrument">AIRSPEED</div>
          <div class="instrument">HEADING</div>
          <div class="instrument">VERTICAL SPEED</div>
        </div>
      </article>

      <article class="panel destination-panel">
        <p class="panel-label">DESTINATION</p>
        <div class="placeholder">TRAVEL POSTER</div>
      </article>
    </section>
  </main>

  <script src="App/main.js"></script>
</body>
</html>
