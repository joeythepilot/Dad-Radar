<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dad Radar</title>

  <link rel="stylesheet" href="./UI/style.css">
</head>

<body>
  <section class="startup-screen" id="startup-screen">
    <p class="unit-label" id="unit-label">
  FLIGHT OPERATIONS UNIT NO. 001
</p>

    <h1 id="startup-app-name">DAD RADAR</h1>

    <p class="status-message">
      INITIALIZING FLIGHT SYSTEMS...
    </p>
  </section>

  <main class="dashboard" id="dashboard" hidden>
    <header class="top-bar">
      <div>
        <p class="small-label" id="dashboard-app-name">DAD RADAR</p>
        <h2>FLIGHT OPERATIONS</h2>
      </div>

      <div class="current-status">
        <p class="small-label">CURRENT STATUS</p>
        <p class="status-value" id="status-value">HOME</p>
      </div>
      <div class="eta-block">
  <p class="small-label">ESTIMATED ARRIVAL</p>
  <p class="eta-value" id="eta-value">--:--</p>
  <span class="eta-zone" id="eta-zone">EASTERN TIME</span>
</div>
    </header>

    <section class="flight-board">
      <span id="flight-board-text">NO ACTIVE FLIGHT</span>
    </section>

    <section class="display-grid">
      <article class="panel map-panel">
        <p class="panel-label">MOVING MAP</p>
        <div class="route-display">
  <span class="route-airport" id="map-origin">ORD</span>

  <div class="route-line">
    <span class="aircraft-marker">✈</span>
  </div>

  <span class="route-airport" id="map-destination">AVL</span>
</div>
      </article>

      <article class="panel instrument-panel">
        <p class="panel-label">FLIGHT DATA</p>

        <div class="instrument-row">
  <div class="instrument">
    <span class="instrument-label">AIRSPEED</span>
    <strong class="instrument-value" id="airspeed-value">---</strong>
    <span class="instrument-unit">KT</span>
  </div>

  <div class="instrument">
    <span class="instrument-label">HEADING</span>
    <strong class="instrument-value" id="heading-value">---</strong>
    <span class="instrument-unit">DEG</span>
  </div>

  <div class="instrument">
    <span class="instrument-label">ALTIMETER</span>
    <strong class="instrument-value" id="altitude-value">-----</strong>
    <span class="instrument-unit">FT</span>
  </div>
</div>
      </article>

      <article class="panel destination-panel">
  <p class="panel-label">DESTINATION</p>

  <div class="destination-content">
    <strong id="destination-city">ASHEVILLE</strong>
    <span id="destination-airport">AVL</span>
  </div>
</article>
    </section>
  </main>

  <script src="config/settings.js"></script>
<script src="models/states.js"></script>
<script src="App/state-engine.js"></script>
<script src="App/main.js"></script>
</body>
</html>
