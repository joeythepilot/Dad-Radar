name: Dad Radar Home Ops

run-name: >-
  Dad Radar Home Ops #${{ github.event.issue.number }} - ${{ github.event.issue.title }}

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: dad-radar-home
  cancel-in-progress: false

jobs:
  home-ops:
    if: startsWith(github.event.issue.title, '[DADRADAR]')
    runs-on: [self-hosted, Windows, X64, dad-radar-home]
    timeout-minutes: 45

    steps:
      - name: Execute allowlisted Dad Radar home operation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          DADRADAR_ISSUE_TITLE: ${{ github.event.issue.title }}
          DADRADAR_ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          $ErrorActionPreference = 'Stop'
          & 'C:\DadRadarOps\DadRadarRemote.ps1' `
            -IssueTitle $env:DADRADAR_ISSUE_TITLE `
            -IssueBody $env:DADRADAR_ISSUE_BODY

          # Protected scheduled-task probes can be handled as UNAVAILABLE while
          # leaving a nonzero LASTEXITCODE behind. If the executor returned normally,
          # the allowlisted action succeeded; real failures throw before this line.
          exit 0
